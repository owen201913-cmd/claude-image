<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ngini 圖片</title>
  <style>
    :root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: var(--color-text-primary, light-dark(#242424, #ececec)); }
    main { position: relative; padding: 0; display: grid; gap: 6px; }
    header { position: absolute; top: 6px; left: 6px; z-index: 1; pointer-events: none; }
    #fixture-label { display: block; padding: 3px 5px; border-radius: 3px; background: #fff0bd; color: #604200; font-size: 10px; font-weight: 700; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; max-height: 460px; object-fit: contain; }
    #download { display: block; position: relative; width: 100%; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    #download:disabled { cursor: default; }
    #download-label { display: inline-block; padding: 4px 0; font-size: 13px; text-decoration: underline; }
    #download-icon { position: absolute; right: 8px; bottom: 8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 4px; background: #0009; color: #fff; opacity: 0; pointer-events: none; }
    #download:not(:disabled):is(:hover, :focus-visible) #download-icon { opacity: 1; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    #status { margin: 0; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    #status[data-state="blocked"] { color: light-dark(#8e4b06, #ffbf79); }
    nav { display: flex; flex-wrap: wrap; gap: 14px; }
    nav button { min-height: 24px; padding: 2px 0; border: 0; background: transparent; color: inherit; font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; }
    nav button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid #6b8bdf; outline-offset: 2px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header hidden><span id="fixture-label" hidden>TEST IMAGE — NOT NGINI</span></header>
    <figure id="image-frame" hidden>
      <button id="download" type="button" aria-label="下載原圖" aria-describedby="preview-label" disabled>
        <img id="preview" alt="圖片預覽" hidden>
        <span id="download-label">下載原圖</span>
        <span id="download-icon" aria-hidden="true">↓</span>
      </button>
      <figcaption id="preview-label" class="visually-hidden" hidden>圖片為預覽；按圖片下載未經壓縮的原始檔案。</figcaption>
    </figure>
    <p id="status" role="status" aria-live="polite">正在連接圖片卡片…</p>
    <div id="details" hidden></div>
    <nav id="recovery" aria-label="任務恢復操作" hidden>
      <button id="refresh" hidden>更新狀態</button>
      <button id="cancel" hidden>停止本機等待</button>
    </nav>
  </main>
  <!-- APP_SCRIPT -->
</body>
</html>
